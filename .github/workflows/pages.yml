name: Publish static studio
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub Pages is not automatically enabled just by adding a workflow.
      # A 404 means we skip deployment, rather than failing unrelated CI runs.
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::GitHub Pages is not enabled. Settings > Pages > Source > GitHub Actions."
              ;;
            *)
              echo "::error::Unable to inspect GitHub Pages (HTTP $status)"
              exit 1
              ;;
          esac
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
