name: Validate and render actual video
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
      - name: Install FFmpeg and dependencies
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -version | head -n 1
          python -m pip install -r requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q shot_sampling.py shot_composition.py dumbbell_classifier.py equipment_guard.py pose_reframe.py smart_reframe.py editor.py montage.py server.py tests
      - name: Run unit, API and real render tests
        run: python -m unittest discover -s tests -v
