name: Validate and render actual video
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Validate public deployment scripts
        run: |
          bash -n scripts/start-public.sh
          APP_API_TOKEN=0123456789abcdef0123456789abcdef docker compose -f compose.yaml -f compose.public.yaml --profile public config -q
      - name: Compile Python modules
        run: python -m compileall -q editor.py montage.py server.py tests
      - name: Run unit, API and real render tests
        run: python -m unittest discover -s tests -v
