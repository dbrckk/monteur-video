name: V1 Docker deployment smoke
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - 'compose.remote.yaml'
      - 'requirements*.txt'
      - 'editor.py'
      - 'smart_reframe.py'
      - 'pose_reframe.py'
      - 'equipment_guard.py'
      - 'dumbbell_classifier.py'
      - 'shot_composition.py'
      - 'shot_sampling.py'
      - 'scripts/download_dumbbell_model.py'
      - 'soundtrack.py'
      - 'montage.py'
      - 'server.py'
      - 'scripts/**'
      - '.github/workflows/docker-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate tunnel Compose and startup scripts
        run: |
          bash -n scripts/start-free.sh scripts/start-stable.sh
          docker compose -f compose.yaml -f compose.remote.yaml config --quiet
      - name: Build FFmpeg engine container with local pose inference
        run: docker build --build-arg INSTALL_WHISPER=0 -t monteur-v1:ci .
      - name: Boot the real API container with a private token
        run: |
          docker run -d --name monteur-v1-smoke \
            -e APP_API_TOKEN=smoke-test-secret-example-length-1234 \
            -p 127.0.0.1:18000:8000 monteur-v1:ci
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18000/api/health > /tmp/monteur-health.json; then
              break
            fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          with open('/tmp/monteur-health.json', encoding='utf-8') as handle:
              data = json.load(handle)
          assert data['ok'] is True, data
          assert data['version'] == '1.0.0', data
          assert data['max_sources'] == 10, data
          PY
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/api/session)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer smoke-test-secret-example-length-1234' \
            http://127.0.0.1:18000/api/session)" = 200
          docker inspect --format '{{.State.Health.Status}}' monteur-v1-smoke
          docker exec monteur-v1-smoke python -c "import os; assert os.environ['HF_HOME']=='/data/huggingface'"
          docker exec monteur-v1-smoke ffmpeg -hide_banner -filters 2>/dev/null | grep ' sidechaincompress ' >/dev/null
          docker exec monteur-v1-smoke python -c "from pathlib import Path; import mediapipe as mp; p=Path('/app/models/pose_landmarker_lite.task'); assert p.is_file(), p; m=mp.tasks.vision.PoseLandmarker.create_from_model_path(str(p)); m.close(); print('CPU person pose model loaded')"
          docker exec monteur-v1-smoke python -c "from pathlib import Path; from pose_reframe import _infer_poses,POSE_WIDTH,POSE_HEIGHT; frames=[bytes([120])*(POSE_WIDTH*POSE_HEIGHT*3)]*2; result=_infer_poses(frames,Path('/app/models/pose_landmarker_lite.task'),0.316); assert isinstance(result,list); print('CPU pose inference OK')"
          docker exec monteur-v1-smoke python -c "from dumbbell_classifier import _network; from pathlib import Path; from scripts.download_dumbbell_model import _hash_file,MODEL_SHA256; import numpy as np,os,resource,mediapipe as mp; m=os.environ['MONTEUR_DUMBBELL_MODEL']; assert _hash_file(Path(m))==MODEL_SHA256; pose=mp.tasks.vision.PoseLandmarker.create_from_model_path(os.environ['MONTEUR_POSE_MODEL']); net=_network(m); net.setInput(np.zeros((1,3,224,224),dtype=np.float32)); a=net.forward().reshape(-1); rss=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024; assert a.size==1000 and np.all(np.isfinite(a)); assert rss<450, f'Combined pose + ONNX model RSS exceeds 450 MiB: {rss:.1f}'; pose.close(); print('Combined CPU MediaPipe + ImageNet ONNX OK, RSS',rss,'MiB')"  
      - name: Capture container logs
        if: always()
        run: docker logs monteur-v1-smoke || true
      - name: Remove smoke container
        if: always()
        run: docker rm -f monteur-v1-smoke || true

  ai-runtime:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build production image with real faster-whisper installed
        run: docker build --build-arg INSTALL_WHISPER=1 -t monteur-v1:ai .
      - name: Verify genuine audio decoding and CPU transcription
        run: |
          docker run --rm -i --entrypoint python monteur-v1:ai - <<'PY'
          import av
          import tempfile
          import wave
          from pathlib import Path
          from faster_whisper.audio import decode_audio
          from faster_whisper import WhisperModel

          assert 17 <= int(av.__version__.split('.')[0]) < 18, av.__version__
          with tempfile.TemporaryDirectory() as folder:
              path = Path(folder) / 'quiet.wav'
              with wave.open(str(path), 'wb') as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(16000)
                  wav.writeframes(bytes(16000 * 2))
              samples = decode_audio(str(path), sampling_rate=16000)
              assert len(samples) == 16000, len(samples)
              model = WhisperModel('tiny', device='cpu', compute_type='int8',
                                   cpu_threads=1, num_workers=1)
              segments, info = model.transcribe(
                  str(path), language='fr', beam_size=1, best_of=1,
                  vad_filter=False, condition_on_previous_text=False)
              assert isinstance(list(segments), list)
          print('Verified actual WAV decode + Whisper transcribe on CPU with PyAV', av.__version__)
          PY
