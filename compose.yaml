services:
  monteur:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      EDITOR_DATA_DIR: /data
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-20}
      APP_API_TOKEN: ${APP_API_TOKEN:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: cpu
    volumes:
      - montages:/data
    init: true
    stop_grace_period: 30s
volumes:
  montages:
